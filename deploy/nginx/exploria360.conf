# STAGE 2 — final config (nginx 1.24 syntax: `listen … ssl http2`) (after DNS points here and the certificate exists).
# Replace 3100 (default 3100). Certificate paths are the certbot defaults.

# HTTP → HTTPS (keeps the ACME path for renewals)
server {
    listen 80;
    listen [::]:80;
    server_name exploria360.com www.exploria360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://www.exploria360.com$request_uri;
    }
}

# apex → www (canonical host)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exploria360.com;

    ssl_certificate     /etc/letsencrypt/live/exploria360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exploria360.com/privkey.pem;

    return 301 https://www.exploria360.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.exploria360.com;

    ssl_certificate     /etc/letsencrypt/live/exploria360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exploria360.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_exploria360:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;   # add "; includeSubDomains; preload" only when sure
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
