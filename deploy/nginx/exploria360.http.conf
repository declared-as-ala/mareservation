# STAGE 1 — HTTP only (used before DNS/TLS are ready, and for the ACME challenge).
# Replace 3100 with the chosen FRONTEND_HOST_PORT (default 3100).
# Install as /etc/nginx/sites-available/exploria360.conf, then symlink into sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name exploria360.com www.exploria360.com;

    # ACME (Let's Encrypt) challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
