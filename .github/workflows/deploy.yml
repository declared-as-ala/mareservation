name: Deploy Exploria360 (manual, SSH key)

# SAFETY MODEL
#  - Manual only (workflow_dispatch). Pushing to main does NOT deploy.
#  - CI (typecheck + tests + builds) must pass before the deploy job starts.
#  - The deploy job targets the GitHub Environment "production": configure
#    required reviewers there so a human approves every deployment.
#  - SSH uses a dedicated key (no passwords) and a PINNED host key
#    (StrictHostKeyChecking=yes) — never "accept any host key".
#  - The remote step is deliberately minimal and non-destructive: it touches
#    only the compose project "exploria360" in its own directory. It never runs
#    image/volume prune, `--force-recreate`, `--remove-orphans`, seeds or DB
#    migrations. Run those by hand, after a backup, when you decide to.
#
# REQUIRED repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST         server IP or hostname
#   VPS_USER         SSH user (prefer a non-root deploy user in the docker group)
#   VPS_SSH_KEY      private key (ed25519) authorised on the VPS for VPS_USER
#   VPS_KNOWN_HOSTS  output of:  ssh-keyscan -t ed25519 <VPS_HOST>   (verify the fingerprint yourself!)
# REQUIRED repository variable:
#   VPS_APP_DIR      absolute path of the Exploria360 checkout on the VPS (e.g. /opt/exploria360)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true

permissions:
  contents: read

concurrency:
  group: exploria360-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend — install, typecheck, test, build
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm test
          npm run build
      - name: Frontend — install, typecheck, build
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SHA: ${{ github.sha }}
      APP_DIR: ${{ vars.VPS_APP_DIR }}
    steps:
      - name: Check configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS APP_DIR; do
            if [ -z "${!v:-}" ]; then echo "::error::Missing required secret/variable: $v"; exit 1; fi
          done

      - name: Prepare SSH (key auth, pinned host key)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy (non-destructive, compose project "exploria360")
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "$VPS_USER@$VPS_HOST" "bash -s" -- "$APP_DIR" "$SHA" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"; SHA="$2"
          cd "$APP_DIR"

          # Refuse to clobber manual edits on the server.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Working tree on the VPS has local modifications — aborting."; exit 1
          fi
          test -f .env || { echo ".env missing in $APP_DIR — create it on the server first."; exit 1; }

          git fetch --prune origin
          git checkout --detach "$SHA"

          docker compose -p exploria360 build
          docker compose -p exploria360 up -d

          echo "Waiting for health…"
          for i in $(seq 1 24); do
            if docker compose -p exploria360 ps --status running | grep -q backend; then
              if docker compose -p exploria360 exec -T backend wget -qO- http://localhost:3001/api/v1/health >/dev/null 2>&1; then
                echo "Healthy"; docker compose -p exploria360 ps; exit 0
              fi
            fi
            sleep 5
          done
          echo "Health check failed — recent logs:"; docker compose -p exploria360 logs --tail=100 backend || true
          exit 1
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
