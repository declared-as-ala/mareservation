# Exploria360 — production stack (isolated compose project: `docker compose -p exploria360 ...`)
#
# - Services listen on 127.0.0.1 ONLY; nginx (TLS) is the single public entry point.
# - No database container: the app uses the external MongoDB (Atlas) from backend/.env.
#   Nothing here publishes a database port.
# - Host ports are configurable so they can be chosen after inspecting the server.
# - The frontend container does NOT receive the backend secrets.
name: exploria360

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exploria360-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3101}:3001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://www.exploria360.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://www.exploria360.com}
      # Only these slugs are publicly visible (demo launch).
      PUBLIC_VENUE_SLUGS: ${PUBLIC_VENUE_SLUGS:-maison-hotes-demo-exploria360}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - exploria360-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:3001
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.exploria360.com}
    container_name: exploria360-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3001
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.exploria360.com}
    depends_on:
      backend:
        condition: service_started
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - exploria360-network

networks:
  exploria360-network:
    driver: bridge
